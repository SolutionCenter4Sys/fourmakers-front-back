# CD Pipeline
include:
  - .gitlab-rules.yml
  - .gitlab-cd.yml


variables:
  FF_USE_FASTZIP: "true"

.is_develop: &is_develop
  - !reference [._is_develop, rules]

.is_release: &is_release
  - !reference [._is_release, rules]
.is_new_protected_branch: &is_new_protected_branch
  - !reference [._is_new_protected_branch, rules]


stages:
  - check-versions
  - check-deploy
  # - pre-build
  - iac-resources
  - publish
  - iac-services
  - deploy
  - deploy-alb-rules
  - tag-version

# Job para verificar versões dos projetos
check_project_versions_develop:
  stage: check-versions
  image: alpine:latest
  environment: DEVELOPMENT
  before_script:
    - apk add --no-cache bash grep curl jq
  script:
    - ./Cfn/scripts/check-project-versions.sh ORGANOGRAMA_API
  artifacts:
    paths:
      - deploy_config.json
    expire_in: 1 hour
  rules:
    - *is_develop

check_project_versions_release:
  stage: check-versions
  image: alpine:latest
  environment: PRODUCTION
  before_script:
    - apk add --no-cache bash grep curl jq
  script:
    - ./Cfn/scripts/check-project-versions.sh ORGANOGRAMA_API
  artifacts:
    paths:
      - deploy_config.json
    expire_in: 1 hour
  rules:
    - *is_release

# Job para verificar se o deploy é necessário
check_deploy:
  stage: check-deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep curl jq
  script:
    - ./Cfn/scripts/check-deploy-from-json.sh ORGANOGRAMA_API
  artifacts:
    paths:
      - deploy_config.json
    expire_in: 1 hour
  rules:
    - *is_develop
    - *is_release

.cd_project_env: &cd_project_env
  - export ECR_PROJECT_PATH=backoffice/organograma-api
  - export CI_AWS_ECS_SERVICE=srv-organograma-api
  - export PROJECT_CFN_PATH=Cfn/organograma-api/
  - export PROJECT_NAME=organograma-api
  - export PROJECT_DOCKER_PATH=Organograma.API/Dockerfile

.ci_env_develop: &ci_env_develop
  - export AWS_PROFILE=fsys2-development
  - export CI_ENV=dev





.ci_env_release: &ci_env_release
  - export AWS_PROFILE=fsys2-production
  - export CI_ENV=prd


.ci_release: &ci_release
  - export CI_RELEASE_VERSION=$(pysemver bump patch $CI_RELEASE_VERSION)

.ci_release_develop: &ci_release_develop
  - *ci_env_develop
  - *ci_release




.ci_release_release: &ci_release_release
  - *ci_env_release
  - export CI_RELEASE_VERSION=${CI_COMMIT_TAG}


