release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - *is_release
  script:
    - export
  release:
    name: 'Backoffice API'
    description: 'Backoffice API'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: URL Base for API
          url: https://api.fourmakers.io
