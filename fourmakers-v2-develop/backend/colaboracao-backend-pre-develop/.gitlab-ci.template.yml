# -----------------------------------------------------------------------------
# CANÔNICO: fonte única para a esteira raiz. O GitLab NÃO carrega este arquivo —
# só o `.gitlab-ci.yml` na raiz é avaliado. Edite triggers (*_ci) apenas aqui;
# o `deploy-manager.sh` copia este arquivo para `.gitlab-ci.yml` e descomenta os
# serviços escolhidos (nunca reordena o YAML com sed).
# -----------------------------------------------------------------------------

# CI Pipeline
include:
  - local: .gitlab-pipeline.yml
  - local: .gitlab-rules.yml


.is_draft: &is_draft
  - !reference [._is_draft, rules]
.is_config: &is_config
  - !reference [._is_config, rules]
.is_feature: &is_feature
  - !reference [._is_feature, rules]
.is_bugfix: &is_bugfix
  - !reference [._is_bugfix, rules]
.is_hotfix: &is_hotfix
  - !reference [._is_hotfix, rules]
.is_merge: &is_merge
  - !reference [._is_merge, rules]
.is_develop: &is_develop
  - !reference [._is_develop, rules]

.is_release: &is_release
  - !reference [._is_release, rules]
.is_new_protected_branch: &is_new_protected_branch
  - !reference [._is_new_protected_branch, rules]

stages:
  - prepare
  - database_migration
  - startup-admissao
  - startup-apontamento
  - startup-bancotalentosrs-consumer
  - startup-bi
  - startup-botfourmakers
  - startup-colaborador
  - startup-competencia
  - startup-crm
  - startup-curriculo-batch-consumer
  - startup-financeiro
  - startup-firebase
  - startup-folha-consumer
  - startup-foursys
  - startup-gestaopessoa
  - startup-labs
  - startup-mapaalocacao
  - startup-maparelacionamento
  - startup-marketing
  - startup-organograma
  - startup-perfilcorporativo
  - startup-projeto
  - startup-rotinasbackoffice
  - startup-social
  - startup-srs
  - startup-uploadfiles
  - startup-usuario
  - release
  - cleanup

database_migration:
  stage: database_migration
  image: mcr.microsoft.com/dotnet/sdk:8.0
  # Só roda em push para main/develop; em pipelines de MR variáveis protegidas não são injetadas.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")
  before_script:
    - "echo Iniciando configuração de variáveis de ambiente"
    - |
      if [ \"${CI_COMMIT_REF_NAME}\" == \"develop\" ]; then
        export CD_MIGRA_CONN_STR=$CD_MIGRATION_CONN_STR_DEVELOPMENT  
        echo "Branch é develop. Usando variável CD_MIGRATION_CONN_STR_DEVELOPMENT."
      elif [ \"${CI_COMMIT_REF_NAME}\" == \"main\" ]; then
        export CD_MIGRA_CONN_STR=$CD_MIGRATION_CONN_STR_PRODUCTION
        echo "Branch é main. Usando variável CD_MIGRATION_CONN_STR_PRODUCTION."
      else
        echo "Branch não é develop nem main. Continuando pipeline..."
        exit 0
      fi
  script:
    - "echo Verificando variáveis de ambiente antes de iniciar a migração..."
    - "echo Branch: ${CI_COMMIT_REF_NAME}"
    - cd ColaboracaoBackend/Fourmakers.Core.Migrations
    - "echo Diretório atual: $(pwd)"
    - "echo Rodando build do projeto..."
    - dotnet build -c Release
    - "echo Build concluído. Executando migração..."
    - dotnet bin/Release/net8.0/Fourmakers.Core.Migrations.dll

docker_prune:
  stage: prepare
  rules:
    - if: $CI_RM_PIPELINE_IMAGE == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"
  script:
    - |
      docker system prune -a -f

