AWSTemplateFormatVersion: 2010-09-09
Description: IaC Architectural Resources
Parameters:
  AwsProfile:
    AllowedValues:
    - fsys2-production
    Type: String
  Env:
    Default: prd
    Type: String
  HealthCheckPath:
    Default: /health
    Type: String
  HostName:
    Default: labs-api
    Type: String
  Priority:
    Default: 1533
    Type: String
  Project:
    Default: labs-api
    Type: String
  RepositoryGroup:
    Default: backoffice
    Type: String
  Secrets:
    Default: arn:aws:secretsmanager:us-east-1:295682605110:secret:fsys2_db_params_prd-12iB81
    Type: String
Resources:
  Stack:
    Properties:
      Parameters:
        AwsProfile:
          Fn::Sub: ${AwsProfile}
        Env:
          Fn::Sub: ${Env}
        HealthCheckPath:
          Fn::Sub: ${HealthCheckPath}
        HostName:
          Fn::Sub: ${HostName}
        Priority:
          Fn::Sub: ${Priority}
        Project:
          Fn::Sub: ${Project}
        RepositoryGroup:
          Fn::Sub: ${RepositoryGroup}
        Secrets:
          Fn::Sub: ${Secrets}
        StackName:
          Fn::Sub: ${AWS::StackName}
      TemplateURL: https://fsys2-bucket-cfn-prd.s3.amazonaws.com/ecs-task-prd-template.yaml
    Type: AWS::CloudFormation::Stack
