AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for shared ASP.NET runtime base image (aspnet + libgdiplus)

Parameters:
  RepositoryName:
    Type: String
    Default: backoffice/dotnet-aspnet-libgdiplus
    Description: Repositório no mesmo padrão das APIs (backoffice/*)

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

Outputs:
  RepositoryUri:
    Description: Registry URI without tag
    Value: !GetAtt Repository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
