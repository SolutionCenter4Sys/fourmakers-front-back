AWSTemplateFormatVersion: 2010-09-09
Description: IaC Architectural Resources
Parameters:
  AwsProfile:
    AllowedValues:
    - fsys2-development
    Type: String
  Env:
    Default: dev
    Type: String
  HealthCheckPath:
    Default: /health
    Type: String
  HostName:
    Default: maparelacionamento-api
    Type: String
  Priority:
    Default: 1605
    Type: String
  Project:
    Default: maparelacionamento-api
    Type: String
  RepositoryGroup:
    Default: backoffice
    Type: String
  Secrets:
    Default: arn:aws:secretsmanager:us-east-1:295682605110:secret:fsys2_db_params_dev-P3j7ex
    Type: String
Resources:
  Stack:
    Properties:
      Parameters:
        AwsProfile:
          Fn::Sub: ${AwsProfile}
        Env:
          Fn::Sub: ${Env}
        HealthCheckPath:
          Fn::Sub: ${HealthCheckPath}
        HostName:
          Fn::Sub: ${HostName}
        Priority:
          Fn::Sub: ${Priority}
        Project:
          Fn::Sub: ${Project}
        RepositoryGroup:
          Fn::Sub: ${RepositoryGroup}
        Secrets:
          Fn::Sub: ${Secrets}
        StackName:
          Fn::Sub: ${AWS::StackName}
      TemplateURL: https://fsys2-bucket-cfn-dev.s3.amazonaws.com/ecs-task-template.yaml
    Type: AWS::CloudFormation::Stack
