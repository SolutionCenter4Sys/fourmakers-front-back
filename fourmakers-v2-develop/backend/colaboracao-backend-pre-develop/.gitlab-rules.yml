# Pipeline Rules
# Mastria @ Foursys

._is_draft:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH =~ /^draft\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/

._is_config:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^config\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH =~ /^config\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/

._is_feature:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH =~ /^feature\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/

._is_merge:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

._is_develop:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"

._is_bugfix:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH =~ /^bugfix\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/

._is_release:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^[vV][0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^[vV][0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^hotfix/ && $CI_COMMIT_TAG =~ /^[vV][0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH =~ /^hotfix/ && $CI_COMMIT_TAG =~ /^[vV][0-9]+\.[0-9]+\.[0-9]+$/

._is_hotfix:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "false" && $CI_COMMIT_BRANCH =~ /^hotfix\/([a-z,A-Z][a-z,A-Z,0-9,_,-]*[a-z,A-Z,0-9]$)/

._is_new_protected_branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_BUILD_BEFORE_SHA == "0000000000000000000000000000000000000000"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_BUILD_BEFORE_SHA == "0000000000000000000000000000000000000000"


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
