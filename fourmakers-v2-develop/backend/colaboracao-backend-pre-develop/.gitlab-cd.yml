# CD Pipeline

._aws_credentials_script: 
  script:
    - |
      curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/load-secure-files/-/raw/main/installer" | bash
      mkdir -p ~/.aws
      mv ./config ~/.aws/
      mv ./credentials ~/.aws/


._ci_release_push_script: 
  script: 
  - |
    curl --silent --request PUT --header "PRIVATE-TOKEN: ${CI_PROJECT_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/CI_RELEASE_VERSION" --form "value=${CI_RELEASE_VERSION}"


._registry_tag_exports: 
  exports: 
    - export CI_COMMIT_DATE_SERIAL=$(date +%y%m%d.%H%M%S -d "$(echo ${CI_COMMIT_TIMESTAMP::19}|tr -s T \ )")
    - export GITLAB_REGISTRY_TAG_COMMIT=${CI_REGISTRY_IMAGE}/${CI_ENV}:${CI_RELEASE_VERSION}-${CI_COMMIT_DATE_SERIAL}-${CI_COMMIT_SHORT_SHA}
    - export GITLAB_REGISTRY_TAG_LATEST=${CI_REGISTRY_IMAGE}/${CI_ENV}:latest
    - export AWS_ECR_TAG_COMMIT=${CI_AWS_ECR}/${ECR_PROJECT_PATH}/${CI_ENV}:${CI_RELEASE_VERSION}-${CI_COMMIT_DATE_SERIAL}-${CI_COMMIT_SHORT_SHA}
    - export AWS_ECR_TAG_LATEST=${CI_AWS_ECR}/${ECR_PROJECT_PATH}/${CI_ENV}:latest


