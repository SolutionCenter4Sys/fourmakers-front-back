._aws_resources_script:
  script:
    - |
      cp ${PROJECT_CFN_PATH}${PROJECT_NAME}-task-${CI_ENV}.env ./Cfn
      cp ${PROJECT_CFN_PATH}${PROJECT_NAME}-task-${CI_ENV}.yaml ./Cfn
      cd Cfn
      make ${PROJECT_NAME}-task-${CI_ENV}.env
      make ${PROJECT_NAME}-task-${CI_ENV}.yaml

._build_image_script:
  script:
    - cd ColaboracaoBackend
    # Base libgdiplus no ECR: backoffice/dotnet-aspnet-libgdiplus:8.0 (jobs base_image_libgdiplus_*)
    - aws ecr get-login-password | docker login --username AWS --password-stdin ${CI_AWS_ECR}
    - jq -n 'env|{CI_PROJECT_PATH, CI_COMMIT_BRANCH, CI_COMMIT_TAG, CI_COMMIT_SHORT_SHA, CI_COMMIT_TIMESTAMP, CI_PROJECT_URL, CI_RELEASE_VERSION}' > info.json
    - docker build -f ${PROJECT_DOCKER_PATH} --pull --build-arg REGISTRY_IMAGE=${CI_AWS_ECR}/backoffice -t ${AWS_ECR_TAG_COMMIT} -t ${AWS_ECR_TAG_LATEST} --no-cache .
    - docker push ${AWS_ECR_TAG_COMMIT}
    - docker push ${AWS_ECR_TAG_LATEST}
    - docker rmi ${AWS_ECR_TAG_LATEST}
    - docker rmi ${AWS_ECR_TAG_COMMIT}


._aws_services_script:
  script:
    - |
      cp ${PROJECT_CFN_PATH}${PROJECT_NAME}-service-${CI_ENV}.yaml ./Cfn
      cd Cfn
      make ${PROJECT_NAME}-service-${CI_ENV}.yaml

._deploy_web_script:
  script:
    - |
      aws ecs update-service --cluster ${CI_AWS_ECS_CLUSTER} --service ${CI_AWS_ECS_SERVICE}-${CI_ENV} --force-new-deployment
      echo "aws ecs update-service --cluster ${CI_AWS_ECS_CLUSTER} --service ${CI_AWS_ECS_SERVICE}-${CI_ENV} --force-new-deployment"

._deploy_alb_rules_script:
  script:
    - |
      cp ${PROJECT_CFN_PATH}*-alb-listener-rule-${CI_ENV}.yaml ./Cfn
      cd Cfn
      for file in ./*-alb-listener-rule-${CI_ENV}.yaml; do
            make $file 
      done